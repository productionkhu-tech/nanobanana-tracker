name: track

on:
  schedule:
    # GitHub Actions schedule is best-effort — public repos often see 30-60 min
    # delays during high-load windows even with `*/5`. We accept this and let the
    # dashboard surface staleness honestly. For tighter cadence, set up an
    # external cron (cron-job.org, EasyCron) to POST repository_dispatch below.
    - cron: '*/5 * * * *'
  workflow_dispatch:           # manual run from Actions tab
  repository_dispatch:
    types: [external-cron]     # external cron services can hit /dispatches

permissions:
  contents: write              # write data.json back to the repo

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true     # leave token configured for git push
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect → build → push
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python app/run.py
