name: track

on:
  schedule:
    - cron: '*/5 * * * *'    # every 5 min (GitHub may delay 5-15 min under load)
  workflow_dispatch:           # manual run from Actions tab

permissions:
  contents: write              # write data.json back to the repo

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true     # leave token configured for git push
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect → build → push
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python app/run.py
